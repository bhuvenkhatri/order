<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Order Sheet Maker</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mut:#6b6b66;--ac:#c77d00;--bd:#ddd9cf;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1a18;--card:#262623;--tx:#eee;--mut:#a5a59d;--bd:#3d3d38}}
:root[data-theme="dark"]{--bg:#1a1a18;--card:#262623;--tx:#eee;--mut:#a5a59d;--bd:#3d3d38}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,Segoe UI,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input[type=text],input[type=number],input[type=date]{width:100%;box-sizing:border-box;padding:11px;font-size:16px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
.sizes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sizes div{text-align:center;font-size:12px;color:var(--mut)}
.sizes input{text-align:center;padding:10px 2px}
button{width:100%;padding:14px;font-size:17px;font-weight:600;border:0;border-radius:10px;background:var(--ac);color:#fff}
button.sec{background:var(--bd);color:var(--tx);font-size:15px;padding:10px;width:auto}
.pic{display:flex;align-items:center;gap:10px}
.pic img{width:56px;height:56px;object-fit:cover;border-radius:6px;display:none}
.row{display:flex;gap:8px;align-items:center}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.thumbs img{width:56px;height:56px;object-fit:cover;border-radius:6px}
.same{font-size:14px;margin-top:6px}
#msg{margin-top:10px;font-size:14px;color:var(--mut);text-align:center}
</style></head><body><main>
<h1>Order Sheet Maker</h1>
<div class="card">
 <label>Customer name</label><input type="text" id="cust" autocapitalize="characters">
 <label>Date</label><input type="date" id="date">
 <label>Kitne style hain?</label><div class="row"><input type="number" id="n" min="1" max="60" value="1" inputmode="numeric"><button class="sec" id="mk">OK</button></div>
</div>
<div id="styles"></div>
<button id="go" style="display:none">Excel file banao</button>
<div id="msg"></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js" onerror="var x=document.createElement('script');x.src='exceljs.min.js';document.head.appendChild(x)"></script>
<script>
const SZ=['S','M','L','XL','XXL'], $=id=>document.getElementById(id);
const imgs={}; // key -> {buf,w,h,url}
$('date').value=new Date().toISOString().slice(0,10);

function nextCode(c){const m=/^(.*?)(\d+)$/.exec(c||'');return m?m[1]+String(+m[2]+1).padStart(m[2].length,'0'):''}

function build(){
  const n=Math.max(1,Math.min(60,+$('n').value||1)), box=$('styles'); box.innerHTML='';
  for(let i=1;i<=n;i++){
    const d=document.createElement('div');d.className='card';
    d.innerHTML=`<b>Style ${i}</b>
    <label>Style name (jaise SKIRT + TOP SET)</label><input type="text" id="nm${i}" autocapitalize="characters">
    <label>Style code (jaise DHI0021)</label><input type="text" id="cd${i}" autocapitalize="characters">
    <label>Style picture</label><input type="file" accept="image/*" id="sp${i}"><div class="thumbs" id="spt${i}"></div>
    <label>Colors pictures (ek se zyada; dobara tap karke aur jod sakte ho)</label><input type="file" accept="image/*" multiple id="cp${i}"><div class="thumbs" id="cpt${i}"></div>
    ${i>1?`<label class="same"><input type="checkbox" id="same${i}"> Pichhle style jaisi colors picture</label>`:''}
    <label>Quantity</label><div class="sizes">${SZ.map((s,k)=>`<div>${s}<input type="number" inputmode="numeric" id="q${i}_${k}" placeholder="0"></div>`).join('')}</div>`;
    box.appendChild(d);
    d.querySelector('#sp'+i).onchange=e=>pickMany(e,'s'+i,'spt'+i,true);
    d.querySelector('#cp'+i).onchange=e=>pickMany(e,'c'+i,'cpt'+i);
    const cd=d.querySelector('#cd'+i);
    if(i>1) d.querySelector('#nm'+i).addEventListener('focus',()=>{if(!cd.value)cd.value=nextCode($('cd'+(i-1)).value)});
  }
  $('go').style.display='block';
}
$('mk').onclick=build; build();

// photos go into Excel in ORIGINAL quality (no shrinking)
function readImg(f){return new Promise(res=>{
  const url=URL.createObjectURL(f), im=new Image();
  im.onload=async()=>{
    const w=im.naturalWidth, h=im.naturalHeight; let buf, ext='jpeg';
    if(f.type==='image/jpeg'||f.type==='image/png'){buf=await f.arrayBuffer(); if(f.type==='image/png')ext='png'}
    else{const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0);
      buf=await new Promise(r=>c.toBlob(b=>b.arrayBuffer().then(r),'image/jpeg',.95));}
    res({buf,w,h,ext,url,el:im});
  };
  im.src=url;});}
function showThumbs(key,boxId){
  const box=$(boxId); box.innerHTML='';
  (imgs[key]||[]).forEach((m,j)=>{const t=document.createElement('img'); t.src=m.url; t.title='hatane ke liye tap karo';
    t.onclick=()=>{imgs[key].splice(j,1); showThumbs(key,boxId)}; box.appendChild(t)});
  if((imgs[key]||[]).length>1){const c=document.createElement('div'); c.style.cssText='font-size:12px;color:var(--mut);align-self:center'; c.textContent=imgs[key].length+' photos (tap = hatao)'; box.appendChild(c)}
}
async function pickMany(e,key,boxId,single){
  const fs=[...e.target.files]; e.target.value='';   // same input can be used again to ADD more photos
  if(!fs.length) return;
  if(single||!imgs[key]) imgs[key]=[];
  for(const f of fs) imgs[key].push(await readImg(f));
  showThumbs(key,boxId);
}
async function compose(list,W,H,G){ // ONE picture W x H: tiles fill the frame fully, thin gaps
  const S=6, c=document.createElement('canvas'); c.width=W*S; c.height=H*S;
  const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height);
  const n=list.length;
  if(n===1){ // single picture / ready-made collage: show it whole, centred
    const m=list[0], k=Math.min((W-2*G)/m.w,(H-2*G)/m.h), w=m.w*k, h=m.h*k;
    x.drawImage(m.el,(W-w)/2*S,(H-h)/2*S,w*S,h*S);
  } else {
    let best=null;
    for(let R=1;R<=n;R++){                       // R rows, photos shared out evenly, every row spans full width
      const counts=[]; for(let q=0;q<R;q++) counts.push(Math.floor(n/R)+(q<n%R?1:0));
      const th=(H-G*(R+1))/R; let loss=0, j=0;
      counts.forEach(cn=>{const tw=(W-G*(cn+1))/cn;
        for(let q=0;q<cn;q++,j++){const m=list[j], k=Math.max(tw/m.w,th/m.h); loss+=1-(tw*th)/(m.w*k*m.h*k)}});
      if(!best||loss<best.loss) best={R,counts,th,loss};
    }
    let j=0;
    best.counts.forEach((cn,ri)=>{
      const tw=(W-G*(cn+1))/cn, dy=G+ri*(best.th+G);
      for(let q=0;q<cn;q++,j++){
        const m=list[j], k=Math.max(tw/m.w,best.th/m.h), sw=tw/k, sh=best.th/k;
        x.drawImage(m.el,(m.w-sw)/2,(m.h-sh)/2,sw,sh,(G+q*(tw+G))*S,dy*S,tw*S,best.th*S);
      }});
  }
  const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.95));
  return b.arrayBuffer();
}
function pick(e,key,imgId){
  const f=e.target.files[0]; if(!f){delete imgs[key];return}
  const url=URL.createObjectURL(f), im=new Image();
  im.onload=async()=>{
    const w=im.naturalWidth, h=im.naturalHeight;
    let buf, ext='jpeg';
    if(f.type==='image/jpeg'||f.type==='image/png'){buf=await f.arrayBuffer(); if(f.type==='image/png')ext='png'}
    else{ // other formats (e.g. HEIC): convert at full size, high quality
      const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0);
      buf=await new Promise(r=>c.toBlob(b=>b.arrayBuffer().then(r),'image/jpeg',.95));
    }
    imgs[key]={buf,w,h,ext};const t=$(imgId);t.src=url;t.style.display='block';
  };
  im.src=url;
}

const B=12, FIRST=4, THIN={style:'thin'};
const border={top:THIN,left:THIN,bottom:THIN,right:THIN};

$('go').onclick=async()=>{
  const cust=$('cust').value.trim().toUpperCase(); if(!cust){alert('Customer ka naam likho');return}
  const n=document.querySelectorAll('#styles .card').length, dt=$('date').value;
  const [y,m,d]=dt.split('-'), dtxt=`${d}-${m}-${y}`;
  $('msg').textContent='Excel ban rahi hai...';
  try{
    const wb=new ExcelJS.Workbook(), ws=wb.addWorksheet('ORDER SHEET');
    ws.columns=[2.7,15.4,52.6,19.3,4.5,4.5,4.5,4.5,4.5,5.4].map(w=>({width:w}));
    ws.pageSetup={paperSize:9,orientation:'portrait',scale:80,horizontalCentered:true,margins:{left:.4,right:.4,top:.3,bottom:.3,header:.1,footer:.1}};
    ws.getRow(2).height=20.25;
    ws.mergeCells('A2:J2'); const t=ws.getCell('A2'); t.value=`${cust} ${dtxt}`;
    t.font={bold:true,size:14}; t.alignment={horizontal:'center',vertical:'middle'};
    for(let c=1;c<=10;c++) ws.getCell(2,c).border=border;
    let lastC=[];
    const totals=[];
    for(let i=1;i<=n;i++){
      const r=FIRST+(i-1)*B, g=id=>$(id).value.trim();
      for(let k=0;k<11;k++){ws.getRow(r+k).height=15.95;for(let c=1;c<=10;c++)ws.getCell(r+k,c).border=border}
      ws.getRow(r+11).height=6.75;
      for(let c=1;c<=10;c++) ws.getCell(r+11,c).fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFFFC000'}};
      ['A','B','C'].forEach(L=>ws.mergeCells(`${L}${r+1}:${L}${r+10}`));
      const put=(a,v,o={})=>{const c=ws.getCell(a);c.value=v;c.alignment={horizontal:o.h||'center',vertical:o.v||'middle'};if(o.b)c.font={bold:true};return c};
      put(`A${r}`,i); put(`B${r}`,'STYLE'); put(`C${r}`,'COLORS'); put(`D${r}`,'Description',{h:'left'}); put(`J${r}`,'Total');
      put(`D${r+1}`,g('nm'+i).toUpperCase(),{h:'left',b:1});
      const cd=g('cd'+i).replace(/[()]/g,'').toUpperCase(); put(`D${r+2}`,cd?`(${cd})`:'',{b:1});
      SZ.forEach((s,k)=>{
        const col=5+k; put(ws.getCell(r+1,col).address,s,{b:1});
        const q=+$(`q${i}_${k}`).value||0; if(q) put(ws.getCell(r+2,col).address,q,{b:1});
        const L=ws.getCell(r+2,col).address.replace(/\d+/,'');
        const tc=put(`${L}${r+5}`,{formula:`SUM(${L}${r+2}:${L}${r+4})`,result:q},{b:1}); tc.font={color:{argb:'FFFF0000'},size:9};
      });
      let tot=0;SZ.forEach((s,k)=>tot+=+$(`q${i}_${k}`).value||0);
      put(`J${r+5}`,{formula:`SUM(E${r+5}:I${r+5})`,result:tot},{b:1}); totals.push([`J${r+5}`,tot]);
      put(`D${r+7}`,'your Ref.',{h:'left',v:'top'});
      // pictures
      const AH=Math.round(10*15.95*4/3)-3;
      const put2=async(list,col0,W,G)=>{            // collage -> ONE image placed at the cell's top-left
        const buf=await compose(list,W,AH,G), id=wb.addImage({buffer:buf,extension:'jpeg'});
        ws.addImage(id,{tl:{col:col0,row:r},ext:{width:W,height:AH},editAs:'oneCell'});
      };
      if(imgs['s'+i]) await put2(imgs['s'+i],1,108,4);
      let list=imgs['c'+i]||[];
      if(i>1&&$('same'+i)&&$('same'+i).checked) list=lastC;
      if(list.length){lastC=list; await put2(list,2,366,4)}
      if(i%5===0&&i<n) ws.getRow(r+11).addPageBreak();
    }
    const tr=FIRST+n*B+1, gt=totals.reduce((a,b)=>a+b[1],0);
    ws.getCell(`D${tr}`).value='GRAND TOTAL'; ws.getCell(`D${tr}`).font={bold:true};
    ws.mergeCells(`E${tr}:I${tr}`);
    const g=ws.getCell(`E${tr}`); g.value={formula:totals.map(x=>x[0]).join('+'),result:gt};
    g.font={bold:true}; g.alignment={horizontal:'center'};
    ws.pageSetup.printArea=`A1:J${tr}`;
    const buf=await wb.xlsx.writeBuffer();
    const fname=`${cust} ${dtxt}.xlsx`;
    const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    $('msg').innerHTML='';
    const b=document.createElement('button'); b.textContent='Excel save / share karo'; b.style.marginTop='8px';
    b.onclick=async()=>{ // fresh tap -> works on iPhone Safari
      try{
        const f=new File([blob],fname,{type:blob.type});
        if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}
      }catch(err){if(err&&err.name==='AbortError')return}
      const u=URL.createObjectURL(blob), a=document.createElement('a'); a.href=u; a.download=fname;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),60000);
    };
    $('msg').append('Excel taiyar hai! Neeche dabao: ',b);
  }catch(e){$('msg').textContent='Error: '+(e.message||e)}
};
</script></body></html>
