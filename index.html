<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Order Sheet Maker</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mut:#6b6b66;--ac:#c77d00;--bd:#ddd9cf;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1a18;--card:#262623;--tx:#eee;--mut:#a5a59d;--bd:#3d3d38}}
:root[data-theme="dark"]{--bg:#1a1a18;--card:#262623;--tx:#eee;--mut:#a5a59d;--bd:#3d3d38}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,Segoe UI,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input[type=text],input[type=number],input[type=date]{width:100%;box-sizing:border-box;padding:11px;font-size:16px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
select{width:100%;box-sizing:border-box;padding:11px;font-size:16px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
.sizes{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px}
.sizes div{text-align:center;font-size:12px;color:var(--mut)}
.sizes input{text-align:center;padding:10px 2px}
button{width:100%;padding:14px;font-size:17px;font-weight:600;border:0;border-radius:10px;background:var(--ac);color:#fff}
button.sec{background:var(--bd);color:var(--tx);font-size:15px;padding:10px;width:auto}
.row{display:flex;gap:8px;align-items:center}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.thumbs img{width:56px;height:56px;object-fit:cover;border-radius:6px}
.cnt{font-size:12px;color:var(--mut);align-self:center}
.same{font-size:14px;margin-top:6px}
#msg{margin-top:10px;font-size:14px;color:var(--mut);text-align:center}
#msg button{margin-top:8px}
.cwrap{position:relative}
#clist{position:absolute;left:0;right:0;top:100%;margin-top:4px;max-height:260px;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--card);border:1px solid var(--bd);border-radius:10px;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.18)}
#clist div{padding:10px 14px;font-size:16px;border-bottom:1px solid var(--bd);cursor:pointer}
#clist div:last-child{border-bottom:0}#clist div:active,#clist div:hover{background:var(--bd)}
#clist .none{color:var(--mut);cursor:default}

/* ===== PHONE ONLY: bigger fonts and buttons ===== */
@media(max-width:700px){
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-size:18px;line-height:1.45}
main{padding:16px max(16px,env(safe-area-inset-right)) 28px max(16px,env(safe-area-inset-left))}
h1{font-size:28px;line-height:1.2;margin:6px 0 16px}
.card{border-radius:16px;padding:18px;margin-bottom:16px}
.card>b{display:block;font-size:21px;margin-bottom:2px}
label{font-size:16px;font-weight:500;margin:16px 0 7px}
input[type=text],input[type=number],input[type=date]{display:block;min-width:0;min-height:52px;padding:12px 14px;font-size:19px;border:1.5px solid var(--bd);border-radius:12px;-webkit-appearance:none;appearance:none}
input:focus,select:focus{outline:2px solid var(--ac);border-color:var(--ac)}
input[type=file]{display:block;width:100%;font-size:16px;color:var(--mut)}
input[type=file]::file-selector-button{display:block;width:100%;min-height:56px;margin:0 0 6px;padding:14px 18px;font-size:20px;font-weight:700;font-family:inherit;color:#fff;background:var(--ac);border:0;border-radius:14px}
select{min-height:52px;padding:12px 14px;font-size:19px;border:1.5px solid var(--bd);border-radius:12px}
.sizes{gap:8px}
.sizes div{font-size:15px;font-weight:600}
.sizes input{padding:12px 2px;font-size:20px;min-height:54px}
button{display:block;min-height:56px;padding:15px;font-size:20px;font-weight:700;border-radius:14px}
button:active{opacity:.8}
button.sec{font-size:18px;min-height:52px;padding:12px 16px;flex:1;width:auto}
.row{gap:10px;align-items:stretch}
.row input[type=number]{flex:1}.row button.sec{flex:0 0 96px}
.thumbs{gap:8px;margin-top:10px}
.thumbs img{width:76px;height:76px;border-radius:10px;border:1px solid var(--bd)}
.cnt{font-size:16px}
.same{display:flex;align-items:center;gap:12px;font-size:17px;margin-top:14px;color:var(--tx)}
.same input{width:26px;height:26px;min-height:0;flex:none}
#go{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:5;box-shadow:0 4px 18px rgba(0,0,0,.28)}
#clist{max-height:300px;border-radius:14px}
#clist div{padding:15px 16px;font-size:20px}
#msg{margin-top:14px;font-size:17px}
#msg button{margin-top:10px}
}

/* ===== v2: autosave UI, style header, drag, toast, dialog ===== */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 6px}
.top h1{margin:0}
button.ghost{width:auto;min-height:0;padding:9px 13px;font-size:15px;font-weight:600;border-radius:10px;background:transparent;color:var(--ac);border:1.5px solid var(--ac);white-space:nowrap}
#saved{font-size:13px;color:var(--mut);min-height:18px;margin-bottom:8px}
.sc{border-left:4px solid var(--ac);scroll-margin-top:12px;transition:box-shadow .25s}
.sc.drag{position:relative;z-index:30;box-shadow:0 14px 34px rgba(0,0,0,.32);transition:none}
.sc.flash{box-shadow:0 0 0 3px var(--ac)}
.sh{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.sh b{flex:1;font-size:18px}
.grip{width:42px;height:42px;flex:none;display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--mut);background:var(--bg);border-radius:10px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
button.ib{width:42px;min-height:42px;height:42px;padding:0;flex:none;font-size:15px;font-weight:700;border-radius:10px;background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
button.ib:disabled{opacity:.3}
button.rm{color:#d33;border-color:#d33}
.th{position:relative;display:inline-block}
.th i{position:absolute;top:-7px;right:-7px;width:26px;height:26px;border-radius:50%;background:#d33;color:#fff;font:700 13px/26px sans-serif;text-align:center;cursor:pointer}
.stot{text-align:right;font-size:14px;color:var(--mut);margin-top:10px}
.empty{text-align:center;color:var(--mut);padding:22px 10px;border:1.5px dashed var(--bd);border-radius:14px;margin-bottom:14px}
button#add{background:transparent;color:var(--ac);border:2px dashed var(--ac);margin-bottom:16px}
#bar{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:5;background:var(--bg);padding:8px 0 2px}
#sum{text-align:center;font-size:14px;color:var(--mut);margin-bottom:6px}
#go{position:static;box-shadow:0 4px 16px rgba(0,0,0,.22)}
#toast{position:fixed;left:12px;right:12px;bottom:calc(104px + env(safe-area-inset-bottom,0px));max-width:536px;margin:0 auto;background:#262623;color:#fff;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;z-index:50;font-size:15px;box-shadow:0 6px 22px rgba(0,0,0,.35)}
#toast[hidden],#dlg[hidden]{display:none}
#toast button{width:auto;min-height:0;padding:7px 14px;font-size:15px;border-radius:8px}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px}
#dlg .box{background:var(--card);border-radius:16px;padding:20px;max-width:380px;width:100%}
#dlg p{color:var(--mut);margin:8px 0 0}
#dlg .row{margin-top:16px}
button.danger{background:#d33;color:#fff}

/* sizes v3 */
.sizes{grid-auto-flow:row;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));grid-auto-columns:auto;gap:8px}
.szh{display:flex;align-items:center;justify-content:center;gap:4px;margin-bottom:3px;color:var(--tx)}
.szh span{font-size:15px;font-weight:700}
button.szx{width:24px;min-height:24px;height:24px;padding:0;flex:none;font-size:11px;font-weight:700;border-radius:50%;background:var(--bd);color:var(--tx)}
.addsz{margin-top:10px}
button.bas{width:100%;flex:none}
.szform{margin-top:8px}
.szform .row input[type=text]{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
button.chip{width:auto;min-height:0;padding:8px 14px;font-size:15px;font-weight:600;border-radius:20px;background:transparent;color:var(--ac);border:1.5px solid var(--ac)}
</style></head><body><main>
<div class="top"><h1>Order Sheet Maker</h1><button type="button" class="ghost" id="newsheet">＋ New sheet</button></div>
<div id="saved"></div>
<div class="card">
 <label>Customer name</label><input type="text" id="cust" autocapitalize="characters">
 <label>Country (optional)</label><div class="cwrap"><input type="text" id="country" placeholder="Search or pick from the list" autocomplete="off" autocapitalize="words"><div id="clist" hidden></div></div>
 <label>Date</label><input type="date" id="date">
</div>
<div id="styles"></div>
<div id="empty" class="empty" hidden>No styles yet. Tap “Add style” below.</div>
<button type="button" id="add">＋ Add style</button>
<div id="bar"><div id="sum"></div><button id="go">Create Excel + PDF</button></div>
<div id="msg"></div>
</main>
<div id="toast" hidden></div>
<div id="dlg" hidden><div class="box"><b style="font-size:19px">Start a new sheet?</b><p>All current data and photos will be deleted. This cannot be undone.</p><div class="row"><button type="button" class="sec" id="dno" style="flex:1">Cancel</button><button type="button" class="sec danger" id="dyes" style="flex:1">Yes, start new</button></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js" onerror="var x=document.createElement('script');x.src='exceljs.min.js';document.head.appendChild(x)"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" onerror="var x=document.createElement('script');x.src='jspdf.umd.min.js';document.head.appendChild(x)"></script>
<script>
const KNOWN=['XS','S','M','L','XL','XXL','3XL','4XL','5XL'], DEFSZ=['S','M','L','XL'], COMBO=['S/M','M/L','L/XL'], rank=n=>{let i=KNOWN.indexOf(n);if(i>=0)return i;i=COMBO.indexOf(n);return i<0?99:20+i}, $=id=>document.getElementById(id);
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
let S={styles:[]}, ready=false;
const newStyle=()=>({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:'',code:'',sizes:DEFSZ.map(n=>({n,q:''})),same:false,sp:[],cp:[]});
function nextCode(c){const m=/^(.*?)(\d+)$/.exec(c||'');return m?m[1]+String(+m[2]+1).padStart(m[2].length,'0'):''}

// ---- autosave: IndexedDB (photos stored as blobs) ----
const DB={
  open(){return this.p||(this.p=new Promise((res,rej)=>{const r=indexedDB.open('ordersheet',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))},
  async get(k){const d=await this.open();return new Promise((res,rej)=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
  async set(k,v){const d=await this.open();return new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
};
const strip=m=>({blob:m.blob,w:m.w,h:m.h,ext:m.ext});
const pack=()=>({v:1,cust:$('cust').value,country:$('country').value,date:$('date').value,
  styles:S.styles.map(s=>({id:s.id,name:s.name,code:s.code,sizes:s.sizes.map(z=>({n:z.n,q:z.q})),same:s.same,sp:s.sp.map(strip),cp:s.cp.map(strip)}))});
let tm; function save(now){if(!ready)return;clearTimeout(tm);tm=setTimeout(doSave,now?0:350)}
async function doSave(){
  const p=pack();
  try{await DB.set('state',p);$('saved').textContent='✓ Auto-saved'}
  catch(e){try{p.styles.forEach(s=>{s.sp=[];s.cp=[]});localStorage.setItem('os_text',JSON.stringify(p));$('saved').textContent='✓ Saved (text only, no photos)'}catch(_){$('saved').textContent='Could not save'}}
}
let lastK=''; setInterval(()=>{const k=$('cust').value+'|'+$('country').value+'|'+$('date').value;if(k!==lastK){lastK=k;save()}},800);
['cust','date'].forEach(id=>$(id).addEventListener('input',()=>save()));
addEventListener('pagehide',()=>save(true)); document.addEventListener('visibilitychange',()=>{if(document.hidden)save(true)});

let tt; function toast(t,act,fn){const el=$('toast');el.innerHTML='';const s=document.createElement('span');s.style.flex='1';s.textContent=t;el.append(s);
  if(act){const b=document.createElement('button');b.textContent=act;b.onclick=()=>{fn();el.hidden=true};el.append(b)}
  el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{el.hidden=true},act?6000:2500)}

// ---- images ----
function readImg(f){return new Promise(res=>{
  const url=URL.createObjectURL(f), im=new Image();
  im.onload=async()=>{
    const w=im.naturalWidth, h=im.naturalHeight; let blob=f, ext=f.type==='image/png'?'png':'jpeg';
    if(f.type!=='image/jpeg'&&f.type!=='image/png'){const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0);
      blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.95)); ext='jpeg'}
    res({blob,w,h,ext,url,el:im});
  };
  im.onerror=()=>res(null); im.src=url;});}
const revive=m=>new Promise(res=>{const url=URL.createObjectURL(m.blob),im=new Image();im.onload=()=>res({...m,url,el:im});im.onerror=()=>res(null);im.src=url});
function thumbs(box,arr){box.innerHTML='';
  arr.forEach((m,j)=>{const w=document.createElement('div');w.className='th';const im=document.createElement('img');im.src=m.url;
    const x=document.createElement('i');x.textContent='✕';x.onclick=()=>{arr.splice(j,1);thumbs(box,arr);save()};w.append(im,x);box.append(w)});
  if(arr.length>1){const c=document.createElement('div');c.className='cnt';c.textContent=arr.length+' photos';box.append(c)}}
async function pick(e,s,key,box,single){
  const fs=[...e.target.files]; e.target.value=''; if(!fs.length) return;
  if(single) s[key]=[];
  for(const f of fs){const m=await readImg(f); if(m) s[key].push(m)}
  thumbs(box,s[key]); save();
}

// ---- styles UI ----
function sums(){
  let n=0; S.styles.forEach(s=>{s.tot=s.sizes.reduce((a,z)=>a+(+z.q||0),0);n+=s.tot});
  document.querySelectorAll('.sc').forEach(c=>{const s=S.styles.find(x=>x.id===c.dataset.id);c.querySelector('.stot').textContent='Total: '+(s?s.tot:0)});
  $('sum').textContent=S.styles.length+' style · '+n+' pcs';
}
function render(){
  const box=$('styles'); box.innerHTML='';
  S.styles.forEach((s,i)=>{if(i==0)s.same=false;box.append(card(s,i))});
  $('empty').hidden=S.styles.length>0; sums();
}
function card(s,i){
  const d=document.createElement('div'); d.className='card sc'; d.dataset.id=s.id;
  d.innerHTML=`<div class="sh"><span class="grip" title="Hold and drag to move up or down">⠿</span><b>Style ${i+1}</b>
  <button type="button" class="ib up" aria-label="Move up">▲</button><button type="button" class="ib dn" aria-label="Move down">▼</button><button type="button" class="ib rm" aria-label="Remove style">✕</button></div>
  <label>Style name (e.g. SKIRT + TOP SET)</label><input type="text" class="nm" autocapitalize="characters">
  <label>Style code (e.g. DHI0021)</label><input type="text" class="cd" autocapitalize="characters">
  <label>Style picture</label><input type="file" accept="image/*" class="fsp"><div class="thumbs tsp"></div>
  <label>Color pictures (select several; tap again to add more)</label><input type="file" accept="image/*" multiple class="fcp"><div class="thumbs tcp"></div>
  ${i>0?'<label class="same"><input type="checkbox" class="sm"> Same color picture as previous style</label>':''}
  <label>Quantity (tap ✕ to remove a size)</label><div class="sizes"></div>
  <div class="addsz"><button type="button" class="sec bas">＋ Add size</button></div>
  <div class="szform" hidden><div class="row"><input type="text" class="szn" placeholder="Custom size (e.g. 4XL, 38, FREE)" autocapitalize="characters"><button type="button" class="sec szok">Add</button></div><div class="chips"></div></div>
  <div class="stot"></div>`;
  const Q=x=>d.querySelector(x), nm=Q('.nm'), cd=Q('.cd');
  nm.value=s.name; cd.value=s.code;
  nm.oninput=()=>{s.name=nm.value;save()}; cd.oninput=()=>{s.code=cd.value;save()};
  nm.onfocus=()=>{const k=S.styles.indexOf(s); if(k>0&&!cd.value){cd.value=s.code=nextCode(S.styles[k-1].code);save()}};
  const grid=Q('.sizes'), form=Q('.szform'), szn=Q('.szn'), chips=Q('.chips');
  const drawSizes=()=>{grid.innerHTML='';
    s.sizes.forEach((z,j)=>{const c=document.createElement('div'),h=document.createElement('div'),lb=document.createElement('span'),x=document.createElement('button'),inp=document.createElement('input');
      h.className='szh';lb.textContent=z.n;x.type='button';x.className='szx';x.textContent='✕';x.setAttribute('aria-label',z.n+' remove');
      x.onclick=()=>{s.sizes.splice(j,1);drawSizes();sums();save()};
      inp.type='number';inp.inputMode='numeric';inp.placeholder='0';inp.value=z.q;inp.oninput=()=>{z.q=inp.value;sums();save()};
      h.append(lb,x);c.append(h,inp);grid.append(c)});
    if(!s.sizes.length){const e=document.createElement('div');e.className='cnt';e.style.gridColumn='1/-1';e.textContent='No sizes - add one below';grid.append(e)}
    chips.innerHTML='';
    KNOWN.concat(COMBO).filter(n=>!s.sizes.some(z=>z.n===n)).forEach(n=>{const b=document.createElement('button');b.type='button';b.className='chip';b.textContent='＋ '+n;b.onclick=()=>addSize(n);chips.append(b)});
  };
  const addSize=n=>{n=(n||'').trim().toUpperCase().replace(/\s+/g,' ');if(!n)return;
    if(s.sizes.some(z=>z.n===n)){toast(n+' is already added');return}
    s.sizes.push({n,q:''});s.sizes.sort((a,b)=>rank(a.n)-rank(b.n));szn.value='';drawSizes();sums();save()};
  Q('.bas').onclick=()=>{form.hidden=!form.hidden;if(!form.hidden)szn.focus()};
  Q('.szok').onclick=()=>addSize(szn.value);
  szn.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addSize(szn.value)}};
  drawSizes();
  
  thumbs(Q('.tsp'),s.sp); thumbs(Q('.tcp'),s.cp);
  Q('.fsp').onchange=e=>pick(e,s,'sp',Q('.tsp'),true); Q('.fcp').onchange=e=>pick(e,s,'cp',Q('.tcp'));
  const sm=Q('.sm'); if(sm){sm.checked=s.same;sm.onchange=()=>{s.same=sm.checked;save()}}
  Q('.up').disabled=i==0; Q('.dn').disabled=i==S.styles.length-1;
  Q('.up').onclick=()=>move(s,-1); Q('.dn').onclick=()=>move(s,1); Q('.rm').onclick=()=>remove(s);
  drag(d,Q('.grip'));
  return d;
}
const cardEl=s=>document.querySelector(`.sc[data-id="${s.id}"]`);
function move(s,dir){const i=S.styles.indexOf(s),j=i+dir; if(j<0||j>=S.styles.length)return;
  [S.styles[i],S.styles[j]]=[S.styles[j],S.styles[i]]; render(); save();
  const c=cardEl(s); c.scrollIntoView({block:'center',behavior:'smooth'}); c.classList.add('flash'); setTimeout(()=>c.classList.remove('flash'),700)}
function remove(s){const i=S.styles.indexOf(s); S.styles.splice(i,1); render(); save();
  toast('Style '+(i+1)+' removed','Undo',()=>{S.styles.splice(Math.min(i,S.styles.length),0,s);render();save()})}
$('add').onclick=()=>{const s=newStyle();S.styles.push(s);render();save();cardEl(s).scrollIntoView({block:'start',behavior:'smooth'})};

// drag handle: neighbours are moved (not the card) so pointer capture is kept
function drag(d,g){
  g.addEventListener('pointerdown',e=>{
    e.preventDefault(); const box=d.parentElement; g.setPointerCapture(e.pointerId); d.classList.add('drag');
    let y0=e.pageY, cy=e.clientY, run=true;
    const step=()=>{
      d.style.transform=`translateY(${cy+scrollY-y0}px)`;
      for(let n=0;n<20;n++){
        const r=d.getBoundingClientRect(), c=r.top+r.height/2, nx=d.nextElementSibling, pv=d.previousElementSibling; let o=0;
        if(nx){const q=nx.getBoundingClientRect(); if(c>q.top+q.height/2)o=1}
        if(!o&&pv){const q=pv.getBoundingClientRect(); if(c<q.top+q.height/2)o=2}
        if(!o)break;
        const b=r.top; o==1?box.insertBefore(nx,d):box.insertBefore(pv,d.nextSibling);
        y0+=d.getBoundingClientRect().top-b; d.style.transform=`translateY(${cy+scrollY-y0}px)`;
      }
    };
    const mv=ev=>{cy=ev.clientY;step()};
    const tick=()=>{if(!run)return; if(cy<90)scrollBy(0,-14); else if(cy>innerHeight-90)scrollBy(0,14); step(); requestAnimationFrame(tick)};
    const end=()=>{run=false; g.removeEventListener('pointermove',mv); g.removeEventListener('pointerup',end); g.removeEventListener('pointercancel',end);
      d.style.transform=''; d.classList.remove('drag');
      S.styles=[...box.children].map(c=>S.styles.find(x=>x.id===c.dataset.id)); render(); save()};
    g.addEventListener('pointermove',mv); g.addEventListener('pointerup',end); g.addEventListener('pointercancel',end);
    step(); requestAnimationFrame(tick);
  });
}

async function compose(list,W,H,G,fill){ // ONE picture W x H: tiles fill the frame fully, thin gaps
  const S=6, c=document.createElement('canvas'); c.width=W*S; c.height=H*S;
  const x=c.getContext('2d'); if(fill!=='inset'){x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height)}
  const n=list.length;
  if(n===1&&fill===true){const m=list[0],k=Math.max(W/m.w,H/m.h),sw=W/k,sh=H/k;x.drawImage(m.el,(m.w-sw)/2,(m.h-sh)/2,sw,sh,0,0,W*S,H*S)}
  else if(n===1){ // single picture / ready-made collage: show it whole, centred
    const m=list[0], k=Math.min((W-2*G)/m.w,(H-2*G)/m.h), w=m.w*k, h=m.h*k;
    x.drawImage(m.el,(W-w)/2*S,(H-h)/2*S,w*S,h*S);
  } else {
    let best=null;
    for(let R=1;R<=n;R++){                       // R rows, photos shared out evenly, every row spans full width
      const counts=[]; for(let q=0;q<R;q++) counts.push(Math.floor(n/R)+(q<n%R?1:0));
      const th=(H-G*(R+1))/R; let loss=0, j=0;
      counts.forEach(cn=>{const tw=(W-G*(cn+1))/cn;
        for(let q=0;q<cn;q++,j++){const m=list[j], k=Math.max(tw/m.w,th/m.h); loss+=1-(tw*th)/(m.w*k*m.h*k)}});
      if(!best||loss<best.loss) best={R,counts,th,loss};
    }
    let j=0;
    best.counts.forEach((cn,ri)=>{
      const tw=(W-G*(cn+1))/cn, dy=G+ri*(best.th+G);
      for(let q=0;q<cn;q++,j++){
        const m=list[j], k=Math.max(tw/m.w,best.th/m.h), sw=tw/k, sh=best.th/k;
        x.drawImage(m.el,(m.w-sw)/2,(m.h-sh)/2,sw,sh,(G+q*(tw+G))*S,dy*S,tw*S,best.th*S);
      }});
  }
  const b=await new Promise(r=>fill==='inset'?c.toBlob(r,'image/png'):c.toBlob(r,'image/jpeg',.95));
  return b.arrayBuffer();
}

const B=12, FIRST=4, THIN={style:'thin'}, border={top:THIN,left:THIN,bottom:THIN,right:THIN};
const AH=Math.round(10*15.95*4/3)-3, SW=112, CW=366;

async function collect(){
  const cust=$('cust').value.trim().toUpperCase();
  if(!cust){toast('Enter the customer name');$('cust').focus();return null}
  if(!S.styles.length){toast('Add at least one style first');return null}
  const L=[];S.styles.forEach(s=>s.sizes.forEach(z=>{if(!L.includes(z.n))L.push(z.n)}));L.sort((a,b)=>rank(a)-rank(b));
  if(!L.length){toast('Keep at least one size');return null}
  if(!$('date').value) $('date').value=today();
  const [y,m,d]=$('date').value.split('-'), styles=[]; let lastBuf=null;
  for(const [idx,s] of S.styles.entries()){
    const q=L.map(n=>{const z=s.sizes.find(z=>z.n===n);return z?(+z.q||0):0});
    let cb=null; if(idx>0&&s.same&&lastBuf) cb=lastBuf; else if(s.cp.length){cb=await compose(s.cp,CW,AH,4); lastBuf=cb}
    const so=s.sp[0]||null;
    styles.push({q,name:s.name.trim().toUpperCase(),code:s.code.trim().replace(/[()]/g,'').toUpperCase(),
      so:so?{buf:await so.blob.arrayBuffer(),w:so.w,h:so.h,ext:so.ext}:null,
      sb:so?await compose([so],SW,AH,6,'inset'):null, cb});
  }
  const ks=L.map((n,k)=>k);
  styles.forEach(s=>{s.tot=ks.reduce((a,k)=>a+s.q[k],0)});
  const country=$('country').value.trim().toUpperCase();
  return {cust:country?cust+' - '+country:cust,dtxt:`${d}-${m}-${y}`,styles,ks,labels:L,grand:styles.reduce((a,s)=>a+s.tot,0)};
}

async function buildXlsx(D){
  const ks=D.ks, m=ks.length, TC=5+m, wb=new ExcelJS.Workbook(), ws=wb.addWorksheet('ORDER SHEET');
  const col=n=>ws.getColumn(n).letter, n=D.styles.length;
  ws.columns=[2.7,15.4,52.6,19.3,...ks.map(k=>Math.max(4.5,D.labels[k].length*1.3+1.5)),5.4].map(w=>({width:w}));
  ws.pageSetup={paperSize:9,orientation:'portrait',scale:m>5?Math.max(40,80-(m-5)*3):80,horizontalCentered:true,margins:{left:.4,right:.4,top:.3,bottom:.3,header:.1,footer:.1}};
  ws.getRow(2).height=20.25; ws.mergeCells(2,1,2,TC);
  const t=ws.getCell('A2'); t.value=`${D.cust} ${D.dtxt}`; t.font={bold:true,size:14}; t.alignment={horizontal:'center',vertical:'middle'};
  for(let c=1;c<=TC;c++) ws.getCell(2,c).border=border;
  const put=(r,c,v,o={})=>{const x=ws.getCell(r,c);x.value=v;x.alignment={horizontal:o.h||'center',vertical:o.v||'middle'};if(o.b)x.font={bold:true};return x};
  D.styles.forEach((s,idx)=>{
    const i=idx+1, r=FIRST+idx*B;
    for(let k=0;k<11;k++){ws.getRow(r+k).height=15.95;for(let c=1;c<=TC;c++)ws.getCell(r+k,c).border=border}
    ws.getRow(r+11).height=6.75;
    for(let c=1;c<=TC;c++) ws.getCell(r+11,c).fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFFFC000'}};
    [1,2,3].forEach(c=>ws.mergeCells(r+1,c,r+10,c));
    put(r,1,i); put(r,2,'STYLE'); put(r,3,'COLORS'); put(r,4,'Description',{h:'left'}); put(r,TC,'Total');
    put(r+1,4,s.name,{h:'left',b:1}); put(r+2,4,s.code?`(${s.code})`:'',{b:1});
    ks.forEach((k,j)=>{const c=5+j, L=col(c);
      put(r+1,c,D.labels[k],{b:1}); if(s.q[k]) put(r+2,c,s.q[k],{b:1});
      const tc=put(r+5,c,{formula:`SUM(${L}${r+2}:${L}${r+4})`,result:s.q[k]}); tc.font={color:{argb:'FFFF0000'},size:9}});
    put(r+5,TC,{formula:`SUM(${col(5)}${r+5}:${col(TC-1)}${r+5})`,result:s.tot},{b:1});
    put(r+7,4,'your Ref.',{h:'left',v:'top'});
    if(s.sb){const id=wb.addImage({buffer:s.sb,extension:'png'}); ws.addImage(id,{tl:{col:1,row:r},br:{col:2,row:r+10},editAs:'twoCell'})}
    if(s.cb){const id=wb.addImage({buffer:s.cb,extension:'jpeg'}); ws.addImage(id,{tl:{col:2,row:r},ext:{width:CW,height:AH},editAs:'oneCell'})}
    if(i%5===0&&i<n) ws.getRow(r+11).addPageBreak();
  });
  const tr=FIRST+n*B+1;
  ws.getCell(tr,4).value='GRAND TOTAL'; ws.getCell(tr,4).font={bold:true};
  ws.mergeCells(tr,5,tr,4+m);
  const g=ws.getCell(tr,5); g.value={formula:D.styles.map((s,idx)=>col(TC)+(FIRST+idx*B+5)).join('+'),result:D.grand};
  g.font={bold:true}; g.alignment={horizontal:'center'};
  ws.pageSetup.printArea=`A1:${col(TC)}${tr}`;
  return new Blob([await wb.xlsx.writeBuffer()],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

function buildPdf(D){
  const {jsPDF}=window.jspdf, doc=new jsPDF({unit:'pt',format:'a4'}), ks=D.ks, m=ks.length;
  const M=22, PW=595-2*M, chars=[2.7,15.4,52.6,19.3,...ks.map(k=>Math.max(4.5,D.labels[k].length*1.3+1.5)),5.4], sum=chars.reduce((a,b)=>a+b);
  const X=[M]; chars.forEach(c=>X.push(X[X.length-1]+c/sum*PW));
  const TH=24, GAP=5, BH=(842-2*M-TH-26)/5, rh=(BH-GAP)/11, nc=chars.length, TC=nc-1;
  const T=(s,x,y,o={})=>{doc.setFont('helvetica',o.b?'bold':'normal');doc.setFontSize(o.sz||8);doc.setTextColor(...(o.c||[0,0,0]));doc.text(String(s),x,y,{align:o.a||'center',baseline:'middle'})};
  const mid=c=>(X[c]+X[c+1])/2, line=(x1,y1,x2,y2)=>doc.line(x1,y1,x2,y2);
  const pic=(buf,asp,cx,cy,cw,ch,fmt)=>{let w=cw,h=cw/asp; if(h>ch){h=ch;w=ch*asp}
    doc.addImage(new Uint8Array(buf),fmt||'JPEG',cx+(cw-w)/2,cy+(ch-h)/2,w,h)};
  doc.setLineWidth(.5); doc.setDrawColor(0);
  D.styles.forEach((s,i)=>{
    if(i%5===0){ if(i) doc.addPage(); doc.rect(M,M,PW,TH); T(`${D.cust} ${D.dtxt}`,M+PW/2,M+TH/2,{b:1,sz:13}) }
    const y0=M+TH+(i%5)*BH;
    doc.setFillColor(255,192,0); doc.rect(M,y0+11*rh,PW,GAP,'F');
    doc.rect(M,y0,PW,11*rh);
    for(let c=1;c<nc;c++) line(X[c],y0,X[c],y0+11*rh);
    for(let r=1;r<11;r++) line(X[3],y0+r*rh,X[nc],y0+r*rh);
    line(X[0],y0+rh,X[3],y0+rh);
    const ry=r=>y0+(r+.5)*rh;
    T(i+1,mid(0),ry(0)); T('STYLE',mid(1),ry(0)); T('COLORS',mid(2),ry(0)); T('Description',X[3]+2,ry(0),{a:'left'}); T('Total',mid(TC),ry(0));
    T(s.name,X[3]+2,ry(1),{a:'left',b:1}); T(s.code?`(${s.code})`:'',mid(3),ry(2),{b:1});
    ks.forEach((k,j)=>{const c=4+j; T(D.labels[k],mid(c),ry(1),{b:1}); if(s.q[k]) T(s.q[k],mid(c),ry(2),{b:1}); T(s.q[k],mid(c),ry(5),{c:[255,0,0],sz:7})});
    T(s.tot,mid(TC),ry(5),{b:1}); T('your Ref.',X[3]+2,ry(7),{a:'left'});
    if(s.so) pic(s.so.buf,s.so.w/s.so.h,X[1]+4,y0+rh+4,X[2]-X[1]-8,10*rh-8,s.so.ext==='png'?'PNG':'JPEG');
    if(s.cb) pic(s.cb,CW/AH,X[2]+1,y0+rh+1,X[3]-X[2]-2,10*rh-2);
  });
  const n=D.styles.length; let y=M+TH+(((n-1)%5)+1)*BH+6;
  if(y+16>842-M){doc.addPage();y=M}
  T('GRAND TOTAL',X[3]+2,y+8,{a:'left',b:1,sz:9}); T(D.grand,(X[4]+X[3+m+1])/2,y+8,{b:1,sz:9});
  return doc.output('blob');
}

async function shareOrSave(blob,fname){
  try{const f=new File([blob],fname,{type:blob.type});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}
  catch(err){if(err&&err.name==='AbortError')return}
  const u=URL.createObjectURL(blob), a=document.createElement('a'); a.href=u; a.download=fname;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),60000);
}

$('go').onclick=async()=>{
  $('msg').textContent='Creating files...';
  try{
    const D=await collect(); if(!D){$('msg').textContent='';return}
    const xl=await buildXlsx(D), pdf=buildPdf(D), base=`${D.cust} ${D.dtxt}`;
    $('msg').innerHTML='Ready! Tap below:';
    [['Save / share Excel',xl,'.xlsx'],['Save / share PDF',pdf,'.pdf']].forEach(([lab,bl,ext])=>{
      const b=document.createElement('button'); b.textContent=lab; b.style.marginTop='8px'; b.onclick=()=>shareOrSave(bl,base+ext); $('msg').append(b)});
  }catch(e){$('msg').textContent='Error: '+(e.message||e)}
};
